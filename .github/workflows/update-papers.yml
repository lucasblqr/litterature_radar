name: Update Literature Radar Papers

on:
  # Check every Monday.
  # The workflow itself only performs the update every second Monday.
  schedule:
    - cron: "17 8 * * 1"
      timezone: "Europe/Berlin"

  # Also gives you a "Run workflow" button for manual testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether this is the correct fortnight
        id: fortnight
        shell: bash
        run: |
          # Manual runs should always proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: updating papers."
            exit 0
          fi

          # First automatic update: Monday 17 August 2026.
          # Then every 14 days.
          anchor=$(( $(date -u -d "2026-08-17" +%s) / 86400 ))
          today=$(( $(date -u +%s) / 86400 ))
          difference=$(( today - anchor ))

          if [ $difference -ge 0 ] && [ $(( difference % 14 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "This is an update week."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This is the off week. No update needed."
          fi

      - name: Checkout repository
        if: steps.fortnight.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Find Literature Radar folder
        if: steps.fortnight.outputs.run == 'true'
        shell: bash
        run: |
          if [ -d "literature_radar_app" ]; then
            echo "APP_DIR=literature_radar_app" >> "$GITHUB_ENV"
          elif [ -d "litterature_radar-main/literature_radar_app" ]; then
            echo "APP_DIR=litterature_radar-main/literature_radar_app" >> "$GITHUB_ENV"
          else
            APP_PATH=$(find . -type d -name "literature_radar_app" | head -n 1)

            if [ -z "$APP_PATH" ]; then
              echo "Could not find literature_radar_app."
              exit 1
            fi

            APP_PATH="${APP_PATH#./}"
            echo "APP_DIR=$APP_PATH" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        if: steps.fortnight.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        if: steps.fortnight.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$APP_DIR/requirements.txt"

      - name: Update papers from the last 60 days
        if: steps.fortnight.outputs.run == 'true'
        shell: bash
        run: |
          cd "$APP_DIR"
          python scripts/update_papers.py --days 60

      - name: Commit updated database
        if: steps.fortnight.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$APP_DIR/papers.db"

          if git diff --cached --quiet; then
            echo "No new papers to commit."
          else
            git commit -m "Automatic literature update"
            git push
          fi
